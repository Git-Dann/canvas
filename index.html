<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Canvas by Gitwork: generative artwork tools. This file is the app and the artwork." />
    <meta name="theme-color" content="#ff4f00" />
    <title>Canvas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff4f00'/%3E%3Cpath d='M7 20c3.3-9.3 6.7-9.3 9 0s6 9.3 9 0' fill='none' stroke='%230a0a0a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <!--
      NOTICE. Canvas by Gitwork. Its file-format kernel is adapted from Foundry
      Deck, a fork of Bento (https://github.com/nyblnet/bento), MIT © 2026 The
      Bento authors. Inter and JetBrains Mono are SIL Open Font License 1.1.
    -->
    <script>
      // Set the theme before first paint. Per-viewer only; never saved in the doc.
      try {
        var t = localStorage.getItem('canvas-theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
